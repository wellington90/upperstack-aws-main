version: 0.2

env:
  parameter-store:
    APP_ENV: /upperstack-aws/APP_ENV
    AWS_REGION_VALUE: /upperstack-aws/AWS_REGION   
    AWS_SECRET_ID: /upperstack-aws/AWS_SECRET_ID
    S3_BUCKET: /upperstack-aws/S3_BUCKET
    LAMBDA_INVOKE_ARN: /upperstack-aws/LAMBDA_INVOKE_ARN
    SQS_QUEUE_URL: /upperstack-aws/SQS_QUEUE_URL
    SQS_PROCESSED_QUEUE_URL: /upperstack-aws/SQS_PROCESSED_QUEUE_URL

phases:
  build:
    commands:
      - echo "Gerando o arquivo .env com parâmetros do AWS Systems Manager Parameter Store..."
      - |
        umask 077
        : > .env
        printf 'APP_ENV=%s\n' "$APP_ENV" >> .env
        printf 'AWS_REGION=%s\n' "$AWS_REGION_VALUE" >> .env     
        printf 'AWS_SECRET_ID=%s\n' "$AWS_SECRET_ID" >> .env
        printf 'S3_BUCKET=%s\n' "$S3_BUCKET" >> .env
        printf 'LAMBDA_INVOKE_ARN=%s\n' "$LAMBDA_INVOKE_ARN" >> .env
        printf 'SQS_QUEUE_URL=%s\n' "$SQS_QUEUE_URL" >> .env
        printf 'SQS_PROCESSED_QUEUE_URL=%s\n' "$SQS_PROCESSED_QUEUE_URL" >> .env
      - test -s .env
      - echo "Arquivo .env criado; os valores não serão exibidos no log."

artifacts:
  files:
    - '**/*'
    - .env
  discard-paths: no
